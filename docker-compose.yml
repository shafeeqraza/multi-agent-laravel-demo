services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            APP_URL: "http://localhost:${APP_PORT}"
            DB_CONNECTION: mysql
            # Inside the Compose network MySQL is always on 3306; DB_PORT in .env is the *host* publish port.
            DB_HOST: database
            DB_PORT: "3306"
            DB_DATABASE: "${DB_DATABASE}"
            DB_USERNAME: "${DB_USERNAME}"
            DB_PASSWORD: "${DB_PASSWORD}"
            # Ensure AI keys reach PHP-FPM (avoids empty OPENAI_API_KEY → 401 Missing bearer).
            OPENAI_API_KEY: "${OPENAI_API_KEY}"
            CHAT_AI_TEXT_PROVIDERS: "${CHAT_AI_TEXT_PROVIDERS:-openai}"
        ports:
            - "${APP_PORT}:80"
        depends_on:
            database:
                condition: service_healthy
        volumes:
            - .:/var/www/html

    database:
        image: mysql:8.4.8
        restart: always
        environment:
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
        ports:
            - "${DB_PORT}:3306"
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "127.0.0.1",
                    "-uroot",
                    "-p${DB_PASSWORD}",
                ]
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    db_data:
